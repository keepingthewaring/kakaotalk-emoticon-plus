<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1"/>
<meta name="color-scheme" content="dark light"/>
<title>KakaoTalk Emoticon Plus</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: sans-serif; background: #121212; color: #e8e8e8;
    min-height: 100vh; display: flex; align-items: center; justify-content: center;
    padding: 24px;
  }
  .card { background: #1e1e1e; border-radius: 20px; padding: 28px; width: 100%; max-width: 420px; }
  h1 { font-size: 20px; font-weight: 600; }
  .sub { color: #9e9e9e; font-size: 13px; margin-top: 4px; margin-bottom: 28px; }
  .row { display: flex; align-items: center; justify-content: space-between; }
  .state { font-size: 15px; }
  .state b.on  { color: #7ee081; }
  .state b.off { color: #ff8a80; }
  .switch { position: relative; width: 56px; height: 32px; flex: 0 0 auto; }
  .switch input { opacity: 0; width: 100%; height: 100%; position: absolute; margin: 0; cursor: pointer; z-index: 1; }
  .slider { position: absolute; inset: 0; background: #555; border-radius: 32px; transition: .2s; }
  .slider:before {
    content: ""; position: absolute; width: 24px; height: 24px; border-radius: 50%;
    background: #fff; top: 4px; left: 4px; transition: .2s;
  }
  input:checked + .slider { background: #fdd835; }
  input:checked + .slider:before { transform: translateX(24px); }
  .warn { color: #ffb74d; font-size: 13px; margin-top: 18px; display: none; line-height: 1.5; }
  .hint { color: #9e9e9e; font-size: 12px; margin-top: 20px; line-height: 1.5; }
  .ver  { color: #666; font-size: 11px; margin-top: 26px; text-align: center; }
</style>
</head>
<body>
<div class="card">
  <h1>이모티콘 플러스</h1>
  <div class="sub">카카오톡 이모티콘 플러스 잠금 해제</div>
  <div class="row">
    <div class="state" id="state">확인 중…</div>
    <label class="switch"><input type="checkbox" id="sw"/><span class="slider"></span></label>
  </div>
  <div class="warn" id="warn">KernelSU 매니저에서 모듈이 비활성화되어 있습니다.<br/>모듈 스위치를 켜야 동작합니다.</div>
  <div class="hint">전환하면 카카오톡이 자동으로 재시작되고<br/>다음 실행부터 적용됩니다.</div>
  <div class="ver" id="ver"></div>
</div>
<script>
(function () {
  "use strict";

  var FLAG = "files/emoplus/disabled";
  var MODDIR = "/data/adb/modules/kakaotalk_emoplus";
  var APP = "com.kakao.talk";

  var sw = document.getElementById("sw");
  var state = document.getElementById("state");
  var warn = document.getElementById("warn");
  var ver = document.getElementById("ver");

  function sh(cmd) { return String(ksu.exec(cmd)); }

  function moduleOff() {
    return sh("test -f " + MODDIR + "/disable -o -f " + MODDIR + "/remove && echo 1 || echo 0").trim() === "1";
  }

  function flagOff() {
    return sh("for d in /data/user/*/" + APP + "; do [ -f \"$d/" + FLAG + "\" ] && echo 1; done")
      .indexOf("1") === 0;
  }

  function render() {
    state.innerHTML = sw.checked
      ? "상태: <b class='on'>켜짐</b>"
      : "상태: <b class='off'>꺼짐</b>";
  }

  function refresh() {
    var mOff = moduleOff();
    var fOff = flagOff();
    warn.style.display = mOff ? "block" : "none";
    sw.checked = !mOff && !fOff;
    render();
  }

  sw.addEventListener("change", function () {
    var on = sw.checked;
    var cmd = on
      ? "for d in /data/user/*/" + APP + "; do rm -f \"$d/" + FLAG + "\"; done"
      : "for d in /data/user/*/" + APP + "; do " +
          "u=$(stat -c '%u:%g' \"$d\"); " +
          "mkdir -p \"$d/files/emoplus\"; " +
          "touch \"$d/" + FLAG + "\"; " +
          "chown -R $u \"$d/files/emoplus\"; " +
        "done";
    sh(cmd);
    sh("am force-stop " + APP);
    ksu.toast(on ? "이모티콘 플러스 켜짐 — 카카오톡 재시작됨"
                 : "이모티콘 플러스 꺼짐 — 카카오톡 재시작됨");
    render();
    setTimeout(refresh, 400);
  });

  try {
    var info = JSON.parse(ksu.moduleInfo());
    ver.textContent = (info.name || "") + "  v" + (info.version || "");
  } catch (e) {}

  if (typeof ksu === "undefined" || typeof ksu.exec !== "function") {
    state.textContent = "KernelSU WebUI 환경이 아닙니다.";
    sw.disabled = true;
    return;
  }
  refresh();
})();
</script>
</body>
</html>
